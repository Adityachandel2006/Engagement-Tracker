<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Engagement Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --paper: #f4f1ea; --paper-deep: #ebe6dc; --panel: #fffdf9; --ink: #17211f; --muted: #71807a; --line: #dce2db; --teal: #0f766e; --teal-dark: #0c5b56; --coral: #d95d39; --sand: #a88d6b; --shadow: 0 16px 36px rgba(27, 43, 38, 0.07); }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Manrope", sans-serif; min-width: 320px; }
    #root { max-width: none; margin: 0; padding: 0; }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: 0.55; }
    .app-shell { min-height: 100vh; background: radial-gradient(circle at 94% 4%, rgba(15, 118, 110, 0.08), transparent 26rem), var(--paper); }
    .topbar, main, .footer { max-width: 1380px; margin: 0 auto; padding-left: 42px; padding-right: 42px; }
    .topbar { min-height: 76px; display: flex; align-items: center; gap: 26px; border-bottom: 1px solid rgba(113, 128, 122, 0.2); }
    .brand { display: flex; align-items: center; gap: 11px; color: var(--ink); font-size: 0.88rem; font-weight: 800; text-decoration: none; letter-spacing: -0.02em; }
    .brand-mark { display: grid; place-items: center; width: 31px; height: 31px; background: var(--ink); color: #fff; font-family: "DM Mono", monospace; font-size: 0.65rem; letter-spacing: -0.08em; }
    .topbar-note { color: var(--muted); font-size: 0.75rem; }
    .live-pill, .report-status, .comparison-badge { margin-left: auto; display: flex; align-items: center; gap: 7px; color: var(--teal); font-family: "DM Mono", monospace; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.08em; }
    .pulse { width: 7px; height: 7px; display: inline-block; border-radius: 50%; background: var(--teal); box-shadow: 0 0 0 4px rgba(15, 118, 110, 0.12); }
    main { padding-top: 54px; padding-bottom: 54px; }
    .workspace-hero { display: grid; grid-template-columns: minmax(260px, 0.78fr) minmax(420px, 1.22fr); gap: 64px; align-items: end; margin-bottom: 56px; }
    .eyebrow { display: block; color: var(--teal); font-family: "DM Mono", monospace; font-size: 0.67rem; font-weight: 500; letter-spacing: 0.13em; text-transform: uppercase; }
    .hero-copy h1 { max-width: 560px; margin: 14px 0; color: var(--ink); font-size: clamp(2.4rem, 4.2vw, 4.6rem); line-height: 0.99; letter-spacing: -0.065em; }
    .hero-copy p { max-width: 485px; margin: 0; color: var(--muted); font-size: 0.98rem; line-height: 1.75; }
    .search-panel { padding: 18px; background: var(--ink); box-shadow: 0 20px 45px rgba(23, 33, 31, 0.17); }
    .search-input-wrap { display: flex; align-items: center; gap: 12px; padding: 0 14px; background: #25312e; border: 1px solid #394a45; }
    .search-icon { color: #8fa8a0; font-family: "DM Mono", monospace; font-size: 1.25rem; }
    .search-input-wrap input { width: 100%; min-width: 0; padding: 18px 0; border: 0; outline: 0; background: transparent; color: #fff; font-size: 1rem; }
    .search-input-wrap input::placeholder { color: #8fa8a0; }
    kbd { padding: 4px 7px; border: 1px solid #53645f; color: #a9bdb5; font-family: "DM Mono", monospace; font-size: 0.63rem; white-space: nowrap; }
    .search-options { display: flex; align-items: end; gap: 12px; margin-top: 14px; }
    .search-options label { flex: 1; color: #92a59e; font-family: "DM Mono", monospace; font-size: 0.64rem; letter-spacing: 0.07em; text-transform: uppercase; }
    select { display: block; width: 100%; margin-top: 7px; padding: 10px 12px; border: 1px solid #394a45; border-radius: 0; background: #25312e; color: #fff; outline: 0; font-family: "Manrope", sans-serif; font-size: 0.8rem; text-transform: capitalize; }
    .primary-button { display: flex; align-items: center; justify-content: space-between; gap: 30px; min-height: 42px; padding: 0 15px; border: 0; background: #d8f0e8; color: var(--teal-dark); font-size: 0.8rem; font-weight: 800; }
    .primary-button:hover { background: #fff; }
    .primary-button span, .text-button span, .suggestions span { font-family: "DM Mono", monospace; }
    .compare-row { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; margin-top: 17px; padding-top: 15px; border-top: 1px solid #394a45; }
    .option-label { margin-right: 5px; color: #92a59e; font-family: "DM Mono", monospace; font-size: 0.63rem; text-transform: uppercase; letter-spacing: 0.07em; }
    .country-option { position: relative; }
    .country-option input { position: absolute; opacity: 0; }
    .country-option span { display: grid; place-items: center; width: 36px; height: 28px; border: 1px solid #53645f; color: #d8f0e8; font-family: "DM Mono", monospace; font-size: 0.62rem; font-weight: 500; }
    .country-option.selected span, .country-option span:hover { border-color: #d8f0e8; background: #d8f0e8; color: var(--teal-dark); }
    .selection-count { color: #92a59e; font-family: "DM Mono", monospace; font-size: 0.6rem; }
    .text-button { margin-left: auto; border: 0; background: transparent; color: #d8f0e8; font-size: 0.72rem; }
    .main-layout { display: grid; grid-template-columns: 205px minmax(0, 1fr); gap: 45px; }
    .activity-rail { position: relative; min-height: 430px; padding-right: 25px; border-right: 1px solid var(--line); }
    .rail-heading { display: flex; align-items: center; justify-content: space-between; }
    .count-badge { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--paper-deep); color: var(--muted); font-family: "DM Mono", monospace; font-size: 0.65rem; }
    .activity-rail h2 { margin: 16px 0 18px; font-size: 1rem; letter-spacing: -0.03em; }
    .history-list { display: grid; gap: 4px; }
    .history-list button { display: flex; align-items: center; gap: 9px; padding: 10px 0; border: 0; border-bottom: 1px solid transparent; background: transparent; color: var(--muted); text-align: left; font-size: 0.78rem; }
    .history-list button:hover { color: var(--ink); border-bottom-color: var(--line); }
    .topic-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--sand); }
    .arrow { margin-left: auto; color: var(--teal); font-family: "DM Mono", monospace; font-size: 0.72rem; }
    .rail-empty, .empty-copy { color: var(--muted); font-size: 0.76rem; line-height: 1.6; }
    .rail-footer { position: absolute; bottom: 0; color: var(--teal); font-family: "DM Mono", monospace; font-size: 0.65rem; line-height: 2; text-transform: uppercase; }
    .rail-footer .pulse { margin-right: 7px; }
    .rail-footer small { padding-left: 16px; color: var(--muted); font-family: "Manrope", sans-serif; font-size: 0.66rem; text-transform: none; }
    .results-area { min-width: 0; }
    .empty-state { min-height: 430px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; padding: 20px 5%; border-top: 1px solid var(--line); }
    .empty-graphic { display: flex; gap: 6px; margin-bottom: 36px; color: var(--teal); font-family: "DM Mono", monospace; font-size: 1.5rem; }
    .empty-graphic span:nth-child(2) { color: var(--coral); transform: translateY(-14px); }
    .empty-state h2 { margin: 15px 0 10px; font-size: 2rem; letter-spacing: -0.055em; }
    .empty-state p { max-width: 460px; margin: 0; color: var(--muted); font-size: 0.85rem; line-height: 1.7; }
    .suggestions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 28px; }
    .suggestions button { display: flex; gap: 20px; padding: 9px 12px; border: 1px solid var(--line); background: transparent; color: var(--ink); font-size: 0.74rem; }
    .suggestions button:hover { border-color: var(--teal); color: var(--teal); }
    .notice { display: flex; align-items: center; gap: 14px; margin-bottom: 24px; padding: 15px 18px; border-left: 3px solid var(--teal); background: var(--panel); box-shadow: var(--shadow); font-size: 0.78rem; }
    .notice strong { font-size: 0.78rem; }
    .notice span:not(.spinner) { color: var(--muted); }
    .notice.error { border-color: var(--coral); }
    .spinner { width: 13px; height: 13px; border: 2px solid var(--line); border-top-color: var(--teal); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .results-stack { animation: appear 0.45s ease both; }
    @keyframes appear { from { opacity: 0; transform: translateY(9px); } to { opacity: 1; transform: none; } }
    .result-intro { display: flex; align-items: end; justify-content: space-between; gap: 20px; padding-bottom: 26px; border-bottom: 1px solid var(--line); }
    .result-intro h1 { margin: 10px 0 7px; color: var(--ink); font-size: 2.4rem; letter-spacing: -0.06em; }
    .result-intro p { margin: 0; color: var(--muted); font-size: 0.78rem; }
    .report-status { margin: 0 0 4px; }
    .metric-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 20px 0; }
    .metric-card { min-height: 128px; padding: 18px 20px; background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow); }
    .metric-card.featured { background: var(--teal); color: #fff; border-color: var(--teal); }
    .metric-label { display: block; color: var(--muted); font-family: "DM Mono", monospace; font-size: 0.63rem; text-transform: uppercase; letter-spacing: 0.07em; }
    .featured .metric-label { color: #bce1d8; }
    .metric-card strong { display: block; margin-top: 19px; font-size: 2.15rem; letter-spacing: -0.07em; }
    .metric-card small { color: var(--muted); font-size: 0.69rem; }
    .featured small { color: #bce1d8; }
    .signals-panel { margin: 0 0 12px; padding: 20px; background: #e9eee8; border: 1px solid var(--line); }
    .signals-heading { display: flex; align-items: start; justify-content: space-between; gap: 12px; margin-bottom: 15px; }
    .signals-heading h2 { margin: 7px 0 0; font-size: 1.05rem; letter-spacing: -0.04em; }
    .signals-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .signal-card { min-height: 133px; padding: 14px 15px; border-left: 3px solid var(--sand); background: var(--panel); }
    .signal-card.positive { border-color: var(--teal); }
    .signal-card.negative, .signal-card.attention { border-color: var(--coral); }
    .signal-topline { display: flex; align-items: center; gap: 7px; margin-bottom: 15px; }
    .signal-icon { display: grid; place-items: center; width: 19px; height: 19px; border-radius: 50%; background: var(--paper-deep); color: var(--teal); font-family: "DM Mono", monospace; font-size: 0.68rem; }
    .negative .signal-icon, .attention .signal-icon { color: var(--coral); }
    .signal-label, .signal-severity { color: var(--muted); font-family: "DM Mono", monospace; font-size: 0.58rem; text-transform: uppercase; letter-spacing: 0.06em; }
    .signal-severity { margin-left: auto; color: var(--teal); }
    .negative .signal-severity, .attention .signal-severity { color: var(--coral); }
    .signal-card strong { display: block; margin-bottom: 6px; color: var(--ink); font-size: 0.88rem; letter-spacing: -0.025em; }
    .signal-card p { margin: 0; color: var(--muted); font-size: 0.69rem; line-height: 1.5; }
    .content-grid { display: grid; grid-template-columns: 1.25fr 0.75fr; gap: 12px; margin-bottom: 12px; }
    .lower-grid { grid-template-columns: 0.75fr 1.25fr; }
    .panel { min-width: 0; padding: 20px; background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow); }
    .section-heading { display: flex; align-items: start; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
    .section-heading h2 { margin: 7px 0 0; font-size: 1rem; letter-spacing: -0.035em; }
    .muted-note { color: var(--muted); font-family: "DM Mono", monospace; font-size: 0.63rem; }
    .sentiment-legend { display: flex; gap: 13px; flex-wrap: wrap; padding-top: 3px; }
    .legend-item { display: flex; align-items: center; gap: 5px; color: var(--muted); font-size: 0.68rem; text-transform: capitalize; }
    .legend-item strong { margin-left: 2px; color: var(--ink); font-family: "DM Mono", monospace; font-size: 0.68rem; }
    .legend-dot { width: 7px; height: 7px; border-radius: 50%; }
    .keywords { display: flex; flex-wrap: wrap; gap: 8px; }
    .keyword-tag { padding: 9px 10px; background: var(--paper); color: var(--ink); font-family: "DM Mono", monospace; font-size: 0.7rem; }
    .keyword-tag b { margin-left: 10px; color: var(--teal); font-weight: 500; }
    .headline-list { display: grid; gap: 12px; max-height: 292px; overflow-y: auto; padding-right: 6px; }
    .headline-list::-webkit-scrollbar { width: 5px; }
    .headline-list::-webkit-scrollbar-thumb { background: var(--line); }
    .headline-panel .headline { padding: 8px 0; border-bottom: 1px solid var(--line); }
    .headline { display: grid; grid-template-columns: 4px 1fr; gap: 10px; }
    .headline-marker { width: 4px; height: 100%; min-height: 35px; }
    .headline-meta { margin-bottom: 4px; color: var(--muted); font-family: "DM Mono", monospace; font-size: 0.6rem; text-transform: uppercase; }
    .headline-meta span { padding: 0 4px; color: var(--line); }
    .headline p { margin: 0; color: var(--ink); font-size: 0.74rem; line-height: 1.5; }
    .country-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 20px; }
    .comparison-summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 20px; }
    .comparison-summary > div { padding: 17px 19px; background: var(--ink); color: #fff; }
    .summary-label { display: block; color: #9db4ac; font-family: "DM Mono", monospace; font-size: 0.61rem; text-transform: uppercase; letter-spacing: 0.07em; }
    .comparison-summary strong { display: block; margin-top: 12px; color: #d8f0e8; font-size: 1.45rem; letter-spacing: -0.06em; }
    .comparison-summary small { display: block; margin-top: 4px; color: #9db4ac; font-size: 0.67rem; }
    .country-heading { display: flex; align-items: center; gap: 11px; padding-bottom: 17px; border-bottom: 1px solid var(--line); }
    .country-code { display: grid; place-items: center; width: 36px; height: 36px; background: var(--paper-deep); color: var(--teal); font-family: "DM Mono", monospace; font-size: 0.68rem; }
    .country-heading h2 { margin: 0 0 3px; font-size: 0.9rem; letter-spacing: -0.03em; }
    .country-heading span { color: var(--muted); font-size: 0.66rem; }
    .coverage-badge { margin-left: auto; padding: 5px 7px; font-family: "DM Mono", monospace; font-size: 0.56rem !important; text-transform: uppercase; white-space: nowrap; }
    .coverage-badge.full { background: #d8f0e8; color: var(--teal-dark) !important; }
    .coverage-badge.limited { background: #f7e5d8; color: #a44b2f !important; }
    .country-chart { margin: 10px 0 2px; }
    .country-chart-block { margin-top: 15px; padding-top: 12px; border-top: 1px solid var(--line); }
    .mini-chart-title { display: flex; justify-content: space-between; color: var(--ink); font-family: "DM Mono", monospace; font-size: 0.61rem; text-transform: uppercase; letter-spacing: 0.05em; }
    .mini-chart-title small { color: var(--muted); font-size: 0.56rem; text-transform: none; letter-spacing: 0; }
    .tone-chart-block .mini-chart-title span { color: var(--coral); }
    .sentiment-bar-wrap { margin: 16px 0 13px; }
    .sentiment-bar { display: flex; width: 100%; height: 9px; overflow: hidden; background: var(--paper-deep); }
    .sentiment-segment { min-width: 0; transition: width 0.35s ease; }
    .sentiment-segment.positive { background: var(--teal); }
    .sentiment-segment.negative { background: var(--coral); }
    .sentiment-segment.neutral { background: var(--sand); }
    .percentage-labels { display: flex; gap: 11px; flex-wrap: wrap; margin-top: 8px; }
    .percentage-labels span { display: flex; align-items: center; gap: 4px; color: var(--muted); font-family: "DM Mono", monospace; font-size: 0.58rem; text-transform: capitalize; }
    .percentage-labels b { color: var(--ink); font-weight: 500; }
    .legend-dot.positive { background: var(--teal); }
    .legend-dot.negative { background: var(--coral); }
    .legend-dot.neutral { background: var(--sand); }
    .footer { display: flex; justify-content: space-between; padding-top: 20px; padding-bottom: 30px; color: var(--muted); font-family: "DM Mono", monospace; font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.07em; }
    @media (max-width: 900px) { .topbar, main, .footer { padding-left: 24px; padding-right: 24px; } .workspace-hero { grid-template-columns: 1fr; gap: 30px; } .main-layout { grid-template-columns: 1fr; gap: 28px; } .activity-rail { min-height: auto; padding: 0 0 18px; border-right: 0; border-bottom: 1px solid var(--line); } .history-list { display: flex; gap: 8px; overflow-x: auto; } .history-list button { min-width: max-content; padding: 8px 10px; border: 1px solid var(--line); background: var(--panel); } .rail-footer { display: none; } }
    @media (max-width: 620px) { .topbar, main, .footer { padding-left: 16px; padding-right: 16px; } .topbar { min-height: 62px; } .topbar-note { display: none; } .live-pill { font-size: 0.58rem; } main { padding-top: 34px; } .hero-copy h1 { font-size: 2.65rem; } .search-options { align-items: stretch; flex-direction: column; } .primary-button { min-height: 46px; } .text-button { width: 100%; margin: 6px 0 0; padding: 8px; text-align: left; } .metric-grid, .content-grid, .lower-grid, .country-grid, .comparison-summary, .signals-grid { grid-template-columns: 1fr; } .result-intro { align-items: start; flex-direction: column; } .result-intro h1 { font-size: 2rem; } .report-status, .comparison-badge { margin: 0; } .panel { padding: 16px; } .footer { gap: 12px; flex-direction: column; } .coverage-badge { display: none; } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
